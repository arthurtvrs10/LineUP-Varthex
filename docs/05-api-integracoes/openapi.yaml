openapi: 3.1.1
info:
  title: Varthex Barber API
  version: 1.0.0
  description: Contrato canônico da API privada e evolução planejada do Varthex Barber.
servers:
  - url: /api/v1
    description: API relativa sob mesma origem
tags:
  - name: Auth
    description: Autenticação, sessão, senha, contato e MFA.
  - name: Tenant
    description: Configuração da barbearia, unidade e políticas.
  - name: Users
    description: Usuários, vínculos, papéis e auditoria.
  - name: Customers
    description: Cadastro, histórico, importação e exportação de clientes.
  - name: Barbers
    description: Perfis profissionais e seus vínculos.
  - name: Services
    description: Categorias, serviços, combos e habilitação profissional.
  - name: Scheduling
    description: Disponibilidade, agendamento, recorrência e estados.
  - name: Waitlist
    description: Fila de espera, ofertas e conversão em reserva.
  - name: Commissions
    description: Regras, lançamentos, ajustes e consultas de comissão.
  - name: Dashboard
    description: Indicadores, relatórios, metas e análises.
  - name: Notifications
    description: Notificações, templates, preferências, CRM e campanhas.
  - name: Cash
    description: Sessões e movimentos do caixa.
  - name: Payments
    description: Recebimentos, reembolsos, comprovantes e conciliação.
  - name: Inventory
    description: Produtos, fornecedores, estoque, compras e transferências.
  - name: Loyalty
    description: Pontos, pacotes e planos vendidos ao cliente final.
  - name: Integrations
    description: Fornecedores, OAuth, webhooks e API pública.
  - name: Subscriptions
    description: Trial, cobrança e direitos da assinatura SaaS.
  - name: Administration
    description: Operação da plataforma e suporte controlado.
security:
  - cookieSession: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: "Sessão criada"
      operationId: login
      x-release: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: "Sessão renovada e refresh rotacionado"
      operationId: refreshSession
      x-release: MVP
      security: []
      responses:
        '200':
          description: Sessão renovada e refresh rotacionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: "Sessão encerrada"
      operationId: logout
      x-release: MVP
      responses:
        '204':
          description: Sessão encerrada
  /auth/password-recovery:
    post:
      tags: [Auth]
      summary: "Solicitação aceita sem revelar existência da conta"
      operationId: requestPasswordRecovery
      x-release: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Solicitação aceita sem revelar existência da conta
  /me:
    get:
      tags: [Users]
      summary: "Usuário e contexto ativos"
      operationId: getCurrentUser
      x-release: MVP
      responses:
        '200':
          description: Usuário e contexto ativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
  /tenant:
    get:
      tags: [Tenant]
      summary: "Tenant atual"
      operationId: getCurrentTenant
      x-release: MVP
      responses:
        '200':
          description: Tenant atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    patch:
      tags: [Tenant]
      summary: "Tenant atualizado"
      operationId: updateCurrentTenant
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Tenant atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/ValidationError'
  /tenant/logo:
    post:
      tags: [Tenant]
      summary: "Logo validada, armazenada e associada ao tenant"
      operationId: uploadTenantLogo
      x-release: MVP
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Tenant com a nova URL controlada da logo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: Arquivo acima do limite permitido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users:
    get:
      tags: [Users]
      summary: "Usuários paginados"
      operationId: listUsers
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Usuários paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
    post:
      tags: [Users]
      summary: "Convite criado"
      operationId: inviteUser
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvite'
      responses:
        '201':
          description: Convite criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
  /customers:
    get:
      tags: [Customers]
      summary: "Clientes paginados"
      operationId: listCustomers
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: query
          in: query
          schema:
            type: string
            maxLength: 160
      responses:
        '200':
          description: Clientes paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
    post:
      tags: [Customers]
      summary: "Cliente criado"
      operationId: createCustomer
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/ValidationError'
  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      summary: "Cliente"
      operationId: getCustomer
      x-release: MVP
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Customers]
      summary: "Cliente atualizado"
      operationId: updateCustomer
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Customers]
      summary: "Cliente arquivado"
      operationId: archiveCustomer
      x-release: MVP
      responses:
        '204':
          description: Cliente arquivado
  /barbers:
    get:
      tags: [Barbers]
      summary: "Profissionais"
      operationId: listBarbers
      x-release: MVP
      responses:
        '200':
          description: Profissionais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Barber'
    post:
      tags: [Barbers]
      summary: "Profissional criado"
      operationId: createBarber
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BarberInput'
      responses:
        '201':
          description: Profissional criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Barber'
  /services:
    get:
      tags: [Services]
      summary: "Serviços"
      operationId: listServices
      x-release: MVP
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Serviços
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags: [Services]
      summary: "Serviço criado"
      operationId: createService
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '201':
          description: Serviço criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
  /services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    patch:
      tags: [Services]
      summary: "Serviço atualizado"
      operationId: updateService
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      responses:
        '200':
          description: Serviço atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '409':
          $ref: '#/components/responses/Conflict'
  /barbers/{barberId}/availability:
    get:
      tags: [Scheduling]
      summary: "Slots disponíveis"
      operationId: getBarberAvailability
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/BarberId'
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Slots disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilitySlot'
  /appointments:
    get:
      tags: [Scheduling]
      summary: "Agenda filtrada"
      operationId: listAppointments
      x-release: MVP
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: barberId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
      responses:
        '200':
          description: Agenda filtrada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
    post:
      tags: [Scheduling]
      summary: "Agendamento criado"
      operationId: createAppointment
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          $ref: '#/components/responses/Conflict'
  /appointments/{appointmentId}:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
    get:
      tags: [Scheduling]
      summary: "Agendamento"
      operationId: getAppointment
      x-release: MVP
      responses:
        '200':
          description: Agendamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Scheduling]
      summary: "Agendamento atualizado"
      operationId: updateAppointment
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdate'
      responses:
        '200':
          description: Agendamento atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          $ref: '#/components/responses/Conflict'
  /appointments/{appointmentId}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [confirm, check-in, start, complete, cancel, no-show]
    post:
      tags: [Scheduling]
      summary: "Estado atualizado"
      operationId: transitionAppointment
      x-release: MVP
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentAction'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          $ref: '#/components/responses/Conflict'
  /appointments/{appointmentId}/reschedule:
    post:
      tags: [Scheduling]
      summary: "Agendamento reagendado"
      operationId: rescheduleAppointment
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: Agendamento reagendado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          $ref: '#/components/responses/Conflict'
  /waitlist-entries:
    get:
      tags: [Waitlist]
      summary: "Fila ativa"
      operationId: listWaitlistEntries
      x-release: MVP
      responses:
        '200':
          description: Fila ativa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WaitlistEntry'
    post:
      tags: [Waitlist]
      summary: "Entrada criada"
      operationId: createWaitlistEntry
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistInput'
      responses:
        '201':
          description: Entrada criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
  /waitlist-entries/{waitlistEntryId}/offers:
    post:
      tags: [Waitlist]
      summary: "Oferta criada"
      operationId: createWaitlistOffer
      x-release: MVP
      parameters:
        - name: waitlistEntryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotStartAt, slotEndAt]
              properties:
                slotStartAt:
                  type: string
                  format: date-time
                slotEndAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Oferta criada
  /commissions/summary:
    get:
      tags: [Commissions]
      summary: "Resumo de comissão"
      operationId: getCommissionSummary
      x-release: MVP
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: barberId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resumo de comissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionSummary'
  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: "Indicadores operacionais"
      operationId: getDashboardOverview
      x-release: MVP
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Indicadores operacionais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
  /notifications:
    get:
      tags: [Notifications]
      summary: "Notificações do usuário"
      operationId: listNotifications
      x-release: MVP
      responses:
        '200':
          description: Notificações do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /cash-sessions:
    post:
      tags: [Cash]
      summary: "Caixa aberto"
      operationId: openCashSession
      x-release: INTERMEDIARIO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashSessionOpen'
      responses:
        '201':
          description: Caixa aberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
        '409':
          $ref: '#/components/responses/Conflict'
  /cash-sessions/{cashSessionId}/close:
    post:
      tags: [Cash]
      summary: "Caixa fechado"
      operationId: closeCashSession
      x-release: INTERMEDIARIO
      parameters:
        - name: cashSessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedAmount]
              properties:
                countedAmount:
                  $ref: '#/components/schemas/Money'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Caixa fechado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSession'
  /payments:
    post:
      tags: [Payments]
      summary: "Grupo e lançamentos por meio registrados atomicamente"
      operationId: createPayment
      x-release: INTERMEDIARIO
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Grupo e lançamentos por meio registrados atomicamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentBatch'
  /products:
    get:
      tags: [Inventory]
      summary: "Produtos"
      operationId: listProducts
      x-release: INTERMEDIARIO
      responses:
        '200':
          description: Produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Inventory]
      summary: "Produto criado"
      operationId: createProduct
      x-release: INTERMEDIARIO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
  /stock-movements:
    post:
      tags: [Inventory]
      summary: "Movimento confirmado"
      operationId: createStockMovement
      x-release: INTERMEDIARIO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementInput'
      responses:
        '201':
          description: Movimento confirmado
  /loyalty/accounts/{customerId}:
    get:
      tags: [Loyalty]
      summary: "Conta e saldo"
      operationId: getCustomerLoyaltyAccount
      x-release: INTERMEDIARIO
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Conta e saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyAccount'
  /integrations:
    get:
      tags: [Integrations]
      summary: "Conexões"
      operationId: listIntegrations
      x-release: INTERMEDIARIO
      responses:
        '200':
          description: Conexões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationConnection'
  /subscription:
    get:
      tags: [Subscriptions]
      summary: "Assinatura e direitos"
      operationId: getCurrentSubscription
      x-release: INTERMEDIARIO
      responses:
        '200':
          description: Assinatura e direitos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
  /admin/tenants:
    get:
      tags: [Administration]
      summary: "Tenants da plataforma"
      operationId: adminListTenants
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Tenants da plataforma
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminPage'
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: "Todas as sessões do usuário foram revogadas"
      operationId: logoutAllSessions
      x-release: MVP
      responses:
        '204':
          description: Todas as sessões do usuário foram revogadas
  /auth/password-recovery/complete:
    post:
      tags: [Auth]
      summary: "Senha redefinida e token consumido"
      operationId: completePasswordRecovery
      x-release: MVP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryComplete'
      responses:
        '204':
          description: Senha redefinida e token consumido
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/password:
    put:
      tags: [Auth]
      summary: "Senha alterada conforme política de revogação"
      operationId: changePassword
      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Senha alterada conforme política de revogação
  /auth/sessions:
    get:
      tags: [Auth]
      summary: "Sessões do usuário"
      operationId: listSessions
      x-release: MVP
      responses:
        '200':
          description: Sessões do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: "Sessão própria revogada"
