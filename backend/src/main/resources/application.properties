server.port=8080
# ResponseStatusException(status, "motivo") só chega no corpo JSON com isso
# ligado — sem ele o front sempre cai no fallback genérico "Erro 409" em
# vez da mensagem real (ex.: "Horário indisponível para este profissional").
server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/varthex_barber}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

google.client-id=${GOOGLE_CLIENT_ID:}