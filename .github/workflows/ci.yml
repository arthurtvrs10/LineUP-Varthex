name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXTAUTH_SECRET: isolated-ci-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          BACKEND_INTERNAL_URL: http://127.0.0.1:9
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: bash mvnw --batch-mode test -Dspring.flyway.enabled=false -Dresend.api-key=
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lineup_ci
          POSTGRES_USER: lineup_ci
          POSTGRES_PASSWORD: isolated_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lineup_ci -d lineup_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Apply migrations and test client onboarding on disposable PostgreSQL
        run: >-
          bash mvnw --batch-mode test -Dtest=backendTests,ClientOnboardingTest,AuthControllerTest,PasswordRecoveryControllerTest,UserControllerTest
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/lineup_ci
          -Dspring.datasource.username=lineup_ci
          -Dspring.datasource.password=isolated_ci_password
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=true
          -Dresend.api-key=
