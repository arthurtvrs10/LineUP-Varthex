server.port=8080
# ResponseStatusException(status, "motivo") só chega no corpo JSON com isso
# ligado — sem ele o front sempre cai no fallback genérico "Erro 409" em
# vez da mensagem real (ex.: "Horário indisponível para este profissional").
server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/varthex_barber}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

google.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.callback-url=${GOOGLE_CALENDAR_CALLBACK_URL:http://localhost:8080/integrations/google-calendar/callback}
google.calendar.encryption-key=${GOOGLE_CALENDAR_ENCRYPTION_KEY:}

# Resend (resend.com) — e-mail transacional (recuperação de senha).
# Sem API key configurada, EmailService só loga e não envia de verdade
# (dev local sem key, e a suíte de testes, que não define essa env var).
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Reject fractional values for integer quantities and limits.
spring.jackson.deserialization.accept-float-as-int=false

# Meta Cloud API. Secrets belong only on the backend; never use NEXT_PUBLIC variables.
whatsapp.encryption-key=${WHATSAPP_ENCRYPTION_KEY:}
whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v23.0}
whatsapp.app-id=${WHATSAPP_APP_ID:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.config-id=${WHATSAPP_CONFIG_ID:}
whatsapp.public-url=${WHATSAPP_PUBLIC_URL:}
whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.worker-enabled=${WHATSAPP_WORKER_ENABLED:true}

# Private avatar bucket. Platform credentials: backend only.
storage.supabase.url=${SUPABASE_URL:}
storage.supabase.secret-key=${SUPABASE_SECRET_KEY:}
storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:lineup-avatars}

# SaaS billing: opt-in; no live calls until enabled and configured.
asaas.enabled=${ASAAS_ENABLED:false}
asaas.environment=${ASAAS_ENVIRONMENT:sandbox}
asaas.api-key=${ASAAS_API_KEY:}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
asaas.grace-days=${ASAAS_GRACE_DAYS:3}
asaas.worker-enabled=${ASAAS_WORKER_ENABLED:true}
asaas.sandbox-actions-enabled=${ASAAS_SANDBOX_ACTIONS_ENABLED:false}
