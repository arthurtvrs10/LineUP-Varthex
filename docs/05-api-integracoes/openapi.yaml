components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: VARTHEX_SESSION
    publicApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 120
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BarberId:
      name: barberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        maxLength: 120
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitIdQuery:
      name: unitId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WaitlistEntryId:
      name: waitlistEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WaitlistOfferId:
      name: waitlistOfferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommissionRuleId:
      name: commissionRuleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageTemplateId:
      name: messageTemplateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CashSessionId:
      name: cashSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PurchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerPlanId:
      name: customerPlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerPlanSubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntegrationType:
      name: integrationType
      in: path
      required: true
      schema:
        type: string
