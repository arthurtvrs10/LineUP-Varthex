          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        tenantId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Tenant:
      type: object
      required: [id, tradeName, status, defaultTimeZone, locale, currency, version]
      properties:
        id:
          type: string
          format: uuid
        tradeName:
          type: string
        legalName:
