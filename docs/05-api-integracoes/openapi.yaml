          maxLength: 180
        document:
          type: [string, 'null']
          maxLength: 14
        defaultTimeZone:
          type: string
        locale:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        version:
          type: integer
          format: int64
    User:
      type: object
