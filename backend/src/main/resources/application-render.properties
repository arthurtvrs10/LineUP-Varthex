# Render supplies PORT. Local and Docker Compose keep their existing settings.
server.port=${PORT:10000}
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Required on Render. Never use the local development signing key in hosting.
app.jwt-secret=${JWT_SIGNING_KEY}
